<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LATEX VISION - Elastic Reality Suite</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Noto Sans"', 'sans-serif'],
          }
        }
      }
    }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <!-- React Flow Styles -->
  <link rel="stylesheet" href="https://esm.sh/reactflow@11.11.4/dist/style.css">
  <style>
    body {
      font-family: 'Noto Sans', sans-serif;
    }
    ::-webkit-scrollbar {
      width: 8px;
    }
    .dark ::-webkit-scrollbar-track {
      background: #09090b;
    }
    .light ::-webkit-scrollbar-track {
      background: #e4e4e7;
    }
    
    .dark ::-webkit-scrollbar-thumb {
      background: #27272a;
      border-radius: 4px;
    }
    .light ::-webkit-scrollbar-thumb {
      background: #a1a1aa;
      border-radius: 4px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: #71717a;
    }
    /* Custom React Flow Theme - Dark */
    .dark .react-flow__node {
      border-radius: 1.5rem;
      padding: 0;
      border: none;
      background: transparent;
    }
    .dark .react-flow__handle {
      width: 8px;
      height: 8px;
      background: #8b5cf6;
      border: 2px solid #09090b;
    }
    .dark .react-flow__edge-path {
      stroke: #27272a;
      stroke-width: 2;
    }
    .dark .react-flow__edge.selected .react-flow__edge-path {
      stroke: #8b5cf6;
    }
    .dark .react-flow__controls {
      background: #18181b;
      border: 1px solid #27272a;
      fill: #a1a1aa;
    }
    .dark .react-flow__controls-button {
      border-bottom: 1px solid #27272a;
    }
    .dark .react-flow__controls-button:hover {
      background: #27272a;
    }

    /* Custom React Flow Theme - Light */
    .light .react-flow__controls {
      background: #ffffff;
      border: 1px solid #e4e4e7;
      fill: #52525b;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    }
    .light .react-flow__controls-button {
      border-bottom: 1px solid #e4e4e7;
    }
    .light .react-flow__controls-button:hover {
      background: #f4f4f5;
    }
  </style>
<script type="importmap">
{
  "imports": {
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "lucide-react": "https://esm.sh/lucide-react@^0.562.0",
    "react-router-dom": "https://esm.sh/react-router-dom@^7.11.0",
    "@google/genai": "https://esm.sh/@google/genai@^1.34.0",
    "reactflow": "https://esm.sh/reactflow@11.11.4",
    "i18next": "https://esm.sh/i18next@23.10.0",
    "react-i18next": "https://esm.sh/react-i18next@14.0.5"
  }
}
</script>
</head>
<body class="overflow-x-hidden bg-zinc-100 text-zinc-900 dark:bg-black dark:text-zinc-100 transition-colors duration-300">
  <div id="root"></div>
</body>
</html>
